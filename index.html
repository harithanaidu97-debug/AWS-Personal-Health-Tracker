<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personal Health Tracker | LiveWell</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
body{min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:center;background:linear-gradient(145deg,#eef5ff,#d9eaff);color:#204b60}
.app-container{width:100%;max-width:500px;height:85vh;min-height:700px;overflow:auto;background:#fff;border-radius:32px;box-shadow:0 25px 45px -12px #0003;position:relative}
.app-header{position:sticky;top:0;z-index:10;background:#fff;padding:20px 22px 12px;border-bottom:1px solid #cde3f5}
.logo-area,.user-row,.flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}.logo-icon{width:44px;height:44px;border-radius:50%;background:#7bc5e8;display:grid;place-items:center;color:white;font-size:25px}
.logo-text h2{font-size:1.15rem;color:#1a6d8f}.logo-text p{font-size:.7rem;color:#3e9ac7}
.trial-badge{background:#c7e2f5;padding:6px 12px;border-radius:60px;font-size:.7rem;font-weight:600;color:#19647e}
.user-row{margin-top:14px}.greeting{font-size:.78rem;background:#f0f9ff;padding:7px 10px;border-radius:30px;color:#2b7a62}
button{cursor:pointer;border:0;transition:.2s}button:hover{filter:brightness(.96)}
.logout-btn,.small-action{border:1px solid #bad6ec;padding:7px 11px;border-radius:30px;background:#eef3fc;color:#3282a3;font-size:.75rem}
.dashboard{padding:18px 20px 30px}.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.stat-card{background:#f9feff;border:1px solid #d9edfc;border-radius:22px;padding:14px 12px}.stat-card>i{font-size:1.6rem;color:#5bb4dc;margin-bottom:8px}.stat-card h4{font-size:.72rem;color:#306e88}
.stat-value{font-size:1.35rem;font-weight:800;color:#1c5f7c;margin:5px 0}.unit{font-size:.7rem;font-weight:400}
.section-title{font-size:1rem;font-weight:700;color:#226f8f;margin:20px 0 12px;display:flex;gap:8px;align-items:center;border-left:4px solid #7bc5e8;padding-left:12px}
.scanner-active,.advice-card{background:linear-gradient(105deg,#e2f0ff,#fff);border:1px solid #bddff5;border-radius:22px;padding:15px;margin:10px 0 12px}
.btn-primary{background:#6bc2e8;padding:10px 14px;border-radius:40px;font-weight:700;color:white}
.scan-result{margin-top:12px;background:#f3faff;border-radius:14px;padding:10px;font-size:.8rem;color:#1f6c8a;overflow-wrap:anywhere}
input,select{border:1px solid #cde3f5;border-radius:16px;padding:10px 12px;width:100%;margin-top:7px;font-size:.85rem;background:#fff}
.water-reminder{display:flex;gap:8px;align-items:center;margin:10px 0}.water-reminder input{min-width:0}
.streak-badge{background:#fef5e3;border-radius:18px;padding:12px;text-align:center;font-weight:700;margin-top:12px;font-size:.85rem}
.back-home-btn{position:sticky;bottom:14px;margin:10px 20px 20px auto;width:48px;height:48px;border-radius:50%;background:#7bc5e8;color:white;display:grid;place-items:center;box-shadow:0 6px 14px #0002;font-size:1.3rem}
.login-wrap{padding:40px 24px;display:flex;flex-direction:column;gap:24px}.login-card{background:#fff;border-radius:28px;padding:26px 20px;box-shadow:0 8px 20px #0000000d}.login-card h3{color:#1a6d8f}.login-card p{font-size:.85rem;margin:10px 0 16px}
@media(max-width:420px){body{padding:8px}.app-container{height:94vh;min-height:650px;border-radius:24px}.dashboard{padding:14px}.app-header{padding:16px}.logo-text h2{font-size:1rem}.trial-badge{font-size:.65rem}}
</style>
</head>
<body>
<div class="app-container" id="appRoot"></div>
<script>
"use strict";
/* APPLICATION SETTINGS */
const REDIRECT_URI = "https://staging.dy3f0mmo0bton.amplifyapp.com/";
const API_URL = "https://gl8fu5pf2i.execute-api.us-east-1.amazonaws.com/health";
const STORAGE_KEY = "healthTrackerData";

let loggedIn = false, userEmail = "", streak = 0, lastLoginDate = null;
let footsteps = 7842, calories = 2150, heartRate = 72, weight = 68;
let sleepHours = 7.2, waterIntake = 4, respiratoryRate = 16;
let bloodGlucose = 98, sleepGoal = 8, workoutMinutes = 32;
let lastScannedFood = null;

function saveAllData() {
  const data = {footsteps,calories,heartRate,weight,sleepHours,waterIntake,
    respiratoryRate,bloodGlucose,sleepGoal,workoutMinutes,streak,lastLoginDate,userEmail};
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch (e) { console.warn("Could not save local health data", e); }
}

function loadAllData() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    footsteps = Number(data.footsteps ?? 7842);
    calories = Number(data.calories ?? 2150);
    heartRate = Number(data.heartRate ?? 72);
    weight = Number(data.weight ?? 68);
    sleepHours = Number(data.sleepHours ?? 7.2);
    waterIntake = Number(data.waterIntake ?? 4);
    respiratoryRate = Number(data.respiratoryRate ?? 16);
    bloodGlucose = Number(data.bloodGlucose ?? 98);
    sleepGoal = Number(data.sleepGoal ?? 8);
    workoutMinutes = Number(data.workoutMinutes ?? 32);
    streak = Number(data.streak ?? 0);
    lastLoginDate = data.lastLoginDate ?? null;
    userEmail = data.userEmail ?? "";
  } catch (e) {
    console.warn("Could not read local health data", e);
  }
}

function updateStreakOnLogin() {
  const today = new Date().toDateString();
  if (lastLoginDate !== today) {
    if (!lastLoginDate) streak = 1;
    else {
      const previous = new Date(lastLoginDate);
      const days = Math.floor(
        (new Date(today).getTime() -
        new Date(previous.toDateString()).getTime()) / 86400000
      );
      streak = days === 1 ? streak + 1 : 1;
    }
    lastLoginDate = today;
  }
  saveAllData();
}

/* PKCE helpers — safely encode Base64URL without the previous "g is not defined" bug. */
/* Cognito authentication removed. */
async function loadHealthFromAWS() {
  try {
    loadAllData();
  } catch (error) {
    console.error("Could not load local health data:", error);
  }
}
async function saveHealthToAWS() {
  try {
    saveAllData();
  } catch (error) {
    console.error("Could not save local health data:", error);
    alert("Could not save your health data in this browser.");
  }
}



  

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[ch]);
}

function renderDashboard() {
  const root = document.getElementById("appRoot");

  root.innerHTML = `
    <header class="app-header">
      <div class="logo-area">
        <div class="logo">
          <div class="logo-icon"><i class="fa-solid fa-heart-pulse"></i></div>
          <div class="logo-text">
            <h2>LiveWell</h2>
            <p>YOUR PERSONAL HEALTH TRACKER</p>
          </div>
        </div>
        <span class="trial-badge">MY WELLNESS</span>
      </div>

      <div class="user-row">
        <span class="greeting"><i class="fa-solid fa-user"></i>
          ${escapeHTML(userEmail)}</span>
        <button class="logout-btn" onclick="logout()">
          <i class="fa-solid fa-right-from-bracket"></i> Sign out
        </button>
      </div>
    </header>

    <main class="dashboard">
      <h3 style="font-size:1.2rem;color:#226f8f;margin-bottom:6px">
        Your daily overview
      </h3>
      <p style="font-size:.8rem;color:#668;margin-bottom:16px">
        ${escapeHTML(new Date().toLocaleDateString(undefined, {
          weekday:"long",year:"numeric",month:"long",day:"numeric"
        }))}
      </p>

      <div class="stats-grid">
        <div class="stat-card">
          <i class="fa-solid fa-person-walking"></i>
          <h4>Daily Steps</h4>
          <div class="stat-value" id="stepsValue">${footsteps.toLocaleString()}</div>
          <div style="font-size:.7rem;color:#668">Illustrative value</div>
          <button class="small-action" onclick="editSteps()">Update steps</button>
        </div>

        <div class="stat-card">
          <i class="fa-solid fa-fire"></i>
          <h4>Calories</h4>
          <div class="stat-value" id="caloriesValue">${calories}</div>
          <div style="font-size:.7rem;color:#668">Estimated daily intake (kcal)</div>
          <button class="small-action" onclick="editCalories()">Update estimate</button>
        </div>

        <div class="stat-card">
          <i class="fa-solid fa-heart-pulse"></i>
          <h4>Heart Rate</h4>
          <div class="stat-value">${heartRate} <span class="unit">bpm</span></div>
          <div style="font-size:.7rem;color:#668">Sample value, not a live reading</div>
        </div>

        <div class="stat-card">
          <i class="fa-solid fa-moon"></i>
          <h4>Sleep</h4>
          <div class="stat-value">${sleepHours} <span class="unit">hours</span></div>
          <div style="font-size:.7rem;color:#668">Your sleep estimate</div>
          <button class="small-action" onclick="editSleep()">Update sleep</button>
        </div>
      </div>

      <h3 class="section-title"><i class="fa-solid fa-weight-scale"></i> Weight Tracker</h3>
      <div class="advice-card">
        <p style="font-size:.85rem">Current weight</p>
        <div class="stat-value"><span id="weightValue">${weight}</span> <span class="unit">kg</span></div>
        <label for="weightInput" style="font-size:.8rem">Update your weight (kg)</label>
        <input id="weightInput" type="number" min="1" max="500" step="0.1"
          placeholder="Enter weight in kg">
        <button class="btn-primary" style="margin-top:10px" onclick="updateWeight()">
          Save weight
        </button>
      </div>

      <h3 class="section-title"><i class="fa-solid fa-glass-water"></i> Water Tracker</h3>
      <div class="advice-card">
        <div class="flex-between">
          <span>Glasses consumed</span>
          <strong id="waterCount">${waterIntake}</strong>
        </div>
        <div style="background:#dcecf6;height:10px;border-radius:10px;margin:12px 0;overflow:hidden">
          <div id="waterBar" style="height:100%;width:${Math.min(waterIntake / 8 * 100,100)}%;background:#5bb4dc;border-radius:10px"></div>
        </div>
        <p style="font-size:.76rem;color:#668;margin-bottom:10px">
          Illustrative goal: 8 glasses daily. Your actual fluid needs vary.
        </p>
        <div class="flex-between">
          <button class="small-action" onclick="changeWater(-1)">− Remove one</button>
          <button class="btn-primary" onclick="changeWater(1)">+ Add a glass</button>
        </div>
      </div>

      <h3 class="section-title"><i class="fa-solid fa-utensils"></i> Food Nutrition Estimator</h3>
      <div class="scanner-active">
        <p style="font-size:.85rem;margin-bottom:5px">
          Enter a food to get an approximate nutrition estimate.
        </p>
        <label for="foodInput" style="font-size:.8rem">Food name</label>
        <input id="foodInput" type="text" placeholder="e.g. idli, banana, rice">
        <label for="foodAmount" style="font-size:.8rem">Quantity / serving</label>
        <select id="foodAmount">
          <option value="1">1 standard serving</option>
          <option value="0.5">Half serving</option>
          <option value="2">2 servings</option>
        </select>
        <button class="btn-primary" style="margin-top:12px;width:100%"
          onclick="estimateFood()">
          Estimate nutrition
        </button>
        <div id="foodResult" class="scan-result" hidden></div>
        <p style="font-size:.7rem;color:#678;margin-top:10px">
          This is a simple illustrative estimator, not an AI food scanner or laboratory analysis.
        </p>
      </div>

      <h3 class="section-title"><i class="fa-solid fa-dumbbell"></i> Exercise Suggestions</h3>
      <div class="advice-card">
        <label for="activityLevel" style="font-size:.8rem">Choose your activity level</label>
        <select id="activityLevel">
          <option value="beginner">Beginner / not very active</option>
          <option value="moderate">Moderately active</option>
          <option value="active">Already active</option>
        </select>
        <button class="btn-primary" style="margin-top:10px;width:100%"
          onclick="suggestExercise()">Get suggestions</button>
        <div id="exerciseResult" class="scan-result" hidden></div>
      </div>

      <h3 class="section-title"><i class="fa-solid fa-bell"></i> Wellness Reminders</h3>
      <div class="advice-card">
        <label for="reminderTime" style="font-size:.8rem">Water reminder interval</label>
        <select id="reminderTime">
          <option value="60">Every 1 hour</option>
          <option value="90">Every 1.5 hours</option>
          <option value="120">Every 2 hours</option>
        </select>
        <button class="btn-primary" style="margin-top:10px;width:100%"
          onclick="startWaterReminder()">Enable reminder while page is open</button>
        <button class="small-action" style="margin-top:10px" onclick="stopWaterReminder()">
          Stop reminder
        </button>
        <div id="reminderStatus" style="font-size:.75rem;margin-top:10px"></div>
        <p style="font-size:.7rem;color:#678;margin-top:8px">
          Browser reminders work only while this page remains open. Notification permission may be requested.
        </p>
      </div>

      <h3 class="section-title"><i class="fa-solid fa-file-lines"></i> Health Summary</h3>
      <div class="advice-card">
        <p style="font-size:.82rem;margin-bottom:12px">
          Generate a simple report of your currently displayed wellness values.
        </p>
        <button class="btn-primary" style="width:100%" onclick="downloadReport()">
          <i class="fa-solid fa-download"></i> Download health report
        </button>
      </div>

      <div class="streak-badge">
        <i class="fa-solid fa-fire" style="color:#edaa45"></i>
        Wellness check-in streak: <span id="streakValue">${streak}</span> day(s)
      </div>

      <p style="font-size:.68rem;color:#789;margin-top:18px;line-height:1.6">
        Health information shown here is for general wellness tracking only.
        Some displayed measurements are sample values. This application does not
        diagnose conditions or replace professional medical advice.
      </p>
    </main>

    <button class="back-home-btn" aria-label="Back to top"
      onclick="document.querySelector('.dashboard').scrollIntoView({behavior:'smooth'})">
      <i class="fa-solid fa-arrow-up"></i>
    </button>
  `;

  updateWaterDisplay();
}

function logout() {
  loggedIn = false;
  userEmail = "User";
  renderDashboard();
}
function editSteps() {
  const value = prompt("Enter your step count:", String(footsteps));
  if (value === null) return;
  const number = Number(value);
  if (!Number.isInteger(number) || number < 0 || number > 200000) {
    alert("Please enter a whole number from 0 to 200000.");
    return;
  }
  footsteps = number;
  saveAllData();
  renderDashboard();
}

function editCalories() {
  const value = prompt("Enter estimated daily calories (kcal):", String(calories));
  if (value === null) return;
  const number = Number(value);
  if (!Number.isFinite(number) || number < 0 || number > 20000) {
    alert("Please enter a valid calorie estimate.");
    return;
  }
  calories = Math.round(number);
  saveAllData();
  renderDashboard();
}

function editSleep() {
  const value = prompt("Enter sleep duration in hours:", String(sleepHours));
  if (value === null) return;
  const number = Number(value);
  if (!Number.isFinite(number) || number < 0 || number > 24) {
    alert("Please enter a number between 0 and 24.");
    return;
  }
  sleepHours = Math.round(number * 10) / 10;
  saveAllData();
  renderDashboard();
}

async function updateWeight() {
  const field = document.getElementById("weightInput");
  const value = Number(field.value);

  if (!field.value || !Number.isFinite(value) || value < 1 || value > 500) {
    alert("Please enter a valid weight between 1 and 500 kg.");
    return;
  }

  weight = Math.round(value * 10) / 10;
  saveAllData();
  document.getElementById("weightValue").textContent = weight;
  field.value = "";
  await saveHealthToAWS();
}

async function changeWater(amount) {
  waterIntake = Math.max(0, Math.min(50, waterIntake + amount));
  saveAllData();
  updateWaterDisplay();
  await saveHealthToAWS();
}

function updateWaterDisplay() {
  const count = document.getElementById("waterCount");
  const bar = document.getElementById("waterBar");
  if (count) count.textContent = waterIntake;
  if (bar) bar.style.width = Math.min(waterIntake / 8 * 100,100) + "%";
}

function estimateFood() {
  const input = document.getElementById("foodInput");
  const amount = Number(document.getElementById("foodAmount").value);
  const name = input.value.trim().toLowerCase();
  const result = document.getElementById("foodResult");

  if (!name) {
    alert("Please enter a food name.");
    input.focus();
    return;
  }

  const foods = {
    "idli": {kcal:58,protein:2,carbs:12,fat:0.4},
    "dosa": {kcal:168,protein:4,carbs:27,fat:5},
    "rice": {kcal:205,protein:4.3,carbs:45,fat:0.4},
    "white rice": {kcal:205,protein:4.3,carbs:45,fat:0.4},
    "chapati": {kcal:120,protein:3.5,carbs:20,fat:3},
    "roti": {kcal:120,protein:3.5,carbs:20,fat:3},
    "banana": {kcal:105,protein:1.3,carbs:27,fat:0.4},
    "apple": {kcal:95,protein:0.5,carbs:25,fat:0.3},
    "egg": {kcal:78,protein:6.3,carbs:0.6,fat:5.3},
    "boiled egg": {kcal:78,protein:6.3,carbs:0.6,fat:5.3},
    "milk": {kcal:122,protein:8,carbs:12,fat:5},
    "curd": {kcal:100,protein:5,carbs:7,fat:5},
    "yogurt": {kcal:100,protein:5,carbs:7,fat:5},
    "oats": {kcal:154,protein:5.3,carbs:27,fat:2.6},
    "almonds": {kcal:164,protein:6,carbs:6,fat:14},
    "peanuts": {kcal:166,protein:7,carbs:6,fat:14},
    "chicken": {kcal:231,protein:43,carbs:0,fat:5},
    "paneer": {kcal:265,protein:18,carbs:4,fat:20},
    "potato": {kcal:130,protein:3,carbs:30,fat:0.2},
    "orange": {kcal:62,protein:1.2,carbs:15,fat:0.2}
  };

  const food = foods[name];
  result.hidden = false;

  if (!food) {
    result.textContent = "No entry found for this food. Try idli, dosa, rice, chapati, banana, apple, egg, milk, curd, oats, almonds, peanuts, chicken, paneer, potato or orange.";
    return;
  }

  const kcal = Math.round(food.kcal * amount);
  const protein = (food.protein * amount).toFixed(1);
  const carbs = (food.carbs * amount).toFixed(1);
  const fat = (food.fat * amount).toFixed(1);

  result.innerHTML = `
    <strong>${escapeHTML(name)}</strong> — estimated nutrition<br>
    Calories: ${kcal} kcal<br>
    Protein: ${protein} g<br>
    Carbohydrates: ${carbs} g<br>
    Fat: ${fat} g<br>
    <span style="font-size:.7rem">Approximate values; actual nutrition depends on serving size and preparation.</span>
  `;

  lastScannedFood = {name,amount,kcal,protein,carbs,fat};
}

function suggestExercise() {
  const level = document.getElementById("activityLevel").value;
  const result = document.getElementById("exerciseResult");
  const suggestions = {
    beginner: "Start gently: try a comfortable 10–15 minute walk, light stretching, and regular breaks from sitting. Increase duration gradually as you feel comfortable.",
    moderate: "Consider a brisk walk, cycling, dancing or another activity you enjoy for 20–30 minutes. Include gentle strength exercises on suitable days.",
    active: "Maintain a balanced routine with aerobic activity, strength training and recovery days. Adjust intensity to your fitness level and avoid training through pain."
  };
  result.hidden = false;
  result.textContent = suggestions[level] +
    " Stop if you feel unwell. Seek medical advice before exercising if you have a health concern or injury.";
}
  
let reminderInterval = null;

function startWaterReminder() {
  stopWaterReminder();

  const minutes = Number(document.getElementById("reminderTime").value);
  const status = document.getElementById("reminderStatus");

  if (!Number.isFinite(minutes) || minutes <= 0) {
    status.textContent = "Please choose a valid reminder interval.";
    return;
  }

  if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission().catch(err =>
      console.warn("Notification permission request failed:", err)
    );
  }

  reminderInterval = window.setInterval(() => {
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification("LiveWell Water Reminder", {
        body: "Take a moment to check whether you need some water."
      });
    } else {
      alert("LiveWell reminder: Remember to check your hydration!");
    }
  }, minutes * 60 * 1000);

  status.textContent =
    `Reminder enabled every ${minutes} minutes while this page remains open.`;
}

function stopWaterReminder() {
  if (reminderInterval !== null) {
    window.clearInterval(reminderInterval);
    reminderInterval = null;
  }

  const status = document.getElementById("reminderStatus");
  if (status) status.textContent = "Water reminder is stopped.";
}

function downloadReport() {
  const report = {
    application: "LiveWell Personal Health Tracker",
    generatedAt: new Date().toLocaleString(),
    account: userEmail,
    wellnessStreakDays: streak,
    steps: footsteps,
    estimatedCaloriesKcal: calories,
    heartRateBpm: heartRate,
    weightKg: weight,
    sleepHours: sleepHours,
    waterGlasses: waterIntake,
    respiratoryRatePerMinute: respiratoryRate,
    bloodGlucoseMgDl: bloodGlucose,
    workoutMinutes: workoutMinutes,
    lastFoodEstimate: lastScannedFood,
    note: "Some values are sample or user-entered estimates, not live medical measurements. This report is not a diagnosis."
  };

  const blob = new Blob(
    [JSON.stringify(report, null, 2)],
    { type: "application/json;charset=utf-8" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "LiveWell-Health-Report.json";
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

loadAllData();
  /* Start the health tracker without Cognito. */
async function handleAuthentication() {
  userEmail = "User";
  loggedIn = true;
  updateStreakOnLogin();

  try {
    await loadHealthFromAWS();
  } catch (error) {
    console.error("Could not load health data:", error);
  }

  renderDashboard();
}
/* Start the app after the page is ready. */
handleAuthentication().catch(error => {
  console.error("Application startup error:", error);
  document.body.innerHTML =
    "<h2>Unable to load the health tracker</h2><p>Please refresh the page and check the browser console.</p>";
});
